<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Library</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563a8;
    --accent-dark: #1d4d7f;
    --border: #e2e6ea;
    --good-bg: #e8f5ec;
    --good-text: #1e7a3d;
    --bad-bg: #fdeeee;
    --bad-text: #b3261e;
    --warn-bg: #fff4e0;
    --warn-text: #93590a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    padding: 2.25rem 1.5rem 1.75rem;
    text-align: center;
  }
  header h1 {
    margin: 0 0 0.35rem;
    font-size: 1.75rem;
    font-weight: 700;
  }
  header p {
    margin: 0;
    opacity: 0.9;
    font-size: 0.95rem;
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  #card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.25rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
    text-align: left;
  }
  .card:hover {
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    transform: translateY(-2px);
  }
  .card h2 {
    margin: 0 0 0.5rem;
    font-size: 1.15rem;
    color: var(--accent-dark);
  }
  .card p {
    margin: 0;
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.4;
  }
  .card .count {
    display: inline-block;
    margin-top: 0.75rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
    background: rgba(37, 99, 168, 0.08);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
  }
  #detail-view { display: none; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    margin-bottom: 1.25rem;
  }
  .back-link:hover { text-decoration: underline; }
  #detail-title {
    margin: 0 0 0.35rem;
    font-size: 1.4rem;
  }
  #detail-description {
    margin: 0 0 1.5rem;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* Facility eligibility summary */
  .summary-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem 1.5rem;
    margin-bottom: 1.75rem;
  }
  .summary-panel h3 {
    margin: 0 0 0.25rem;
    font-size: 1.05rem;
  }
  .summary-panel .summary-sub {
    margin: 0 0 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .summary-table-wrap {
    overflow-x: auto;
  }
  table.summary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.summary-table th {
    text-align: left;
    padding: 0.5rem 0.6rem;
    border-bottom: 2px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  table.summary-table td {
    padding: 0.55rem 0.6rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.summary-table tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
  }
  .badge-good { background: var(--good-bg); color: var(--good-text); }
  .badge-bad { background: var(--bad-bg); color: var(--bad-text); }
  .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
  .summary-note {
    margin: 0.9rem 0 0;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .focus-row { background: #eaf1fb; }
  .state-group-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .focus-legend {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--muted);
    margin-left: 0.75rem;
  }
  .focus-swatch {
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 3px;
    background: #eaf1fb;
    border: 1px solid #c7d9f2;
    display: inline-block;
  }

  .doc-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .doc-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }
  .doc-item .doc-info h3 {
    margin: 0 0 0.25rem;
    font-size: 1rem;
  }
  .doc-item .doc-info p {
    margin: 0 0 0.15rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .doc-item .doc-info .date {
    font-size: 0.75rem;
    color: #9aa3ad;
  }
  .doc-item a.open-btn {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    white-space: nowrap;
  }
  .doc-item a.open-btn:hover { background: var(--accent-dark); }

  /* Collapsible folder groups within a card's document list */
  .doc-group {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    overflow: hidden;
  }
  .doc-group-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: none;
    border: none;
    padding: 0.9rem 1.1rem;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }
  .doc-group-header:hover { background: rgba(37, 99, 168, 0.05); }
  .doc-group-icon { font-size: 1rem; line-height: 1; }
  .doc-group-title { flex: 1; }
  .doc-group-count {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    background: rgba(37, 99, 168, 0.08);
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
  }
  .doc-group-chevron {
    font-size: 0.85rem;
    color: var(--muted);
    transition: transform 0.15s ease;
  }
  .doc-group.expanded .doc-group-chevron { transform: rotate(180deg); }
  .doc-group-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease;
  }
  .doc-group.expanded .doc-group-body { max-height: 1200px; }
  .doc-group-list {
    list-style: none;
    margin: 0;
    padding: 0 1.1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .empty-state {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 12px;
    background: var(--card-bg);
  }
  .empty-state code {
    background: #eef1f4;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>Knowledge Library</h1>
  <p>Reference documents, organized by topic</p>
</header>

<main>
  <div id="card-grid"></div>

  <div id="detail-view">
    <button class="back-link" onclick="showGrid()">&larr; Back to all topics</button>
    <h2 id="detail-title"></h2>
    <p id="detail-description"></p>
    <div id="team-hospital-summary"></div>
    <div id="facility-summary"></div>
    <ul class="doc-list" id="doc-list"></ul>
  </div>
</main>

<script src="documents.js"></script>
<script>
  function renderGrid() {
    const grid = document.getElementById("card-grid");
    grid.innerHTML = "";
    CARDS.forEach((card) => {
      const count = DOCUMENTS.filter((d) => d.cardId === card.id).length;
      const el = document.createElement("div");
      el.className = "card";
      el.onclick = () => showDetail(card.id);
      el.innerHTML = `
        <h2>${card.title}</h2>
        <p>${card.description}</p>
        <span class="count">${count} document${count === 1 ? "" : "s"}</span>
      `;
      grid.appendChild(el);
    });
  }

  function renderTeamHospitalSummary(cardId) {
    const container = document.getElementById("team-hospital-summary");
    container.innerHTML = "";

    const summary = typeof TEAM_HOSPITAL_SUMMARY !== "undefined" ? TEAM_HOSPITAL_SUMMARY : null;
    if (!summary || summary.cardId !== cardId) return;

    const byState = { NM: [], TX: [] };
    summary.hospitals.forEach((h) => {
      if (byState[h.state]) byState[h.state].push(h);
    });

    const stateBlock = (stateCode, stateLabel) => {
      const list = byState[stateCode] || [];
      const focusCount = list.filter((h) => h.inFocusMarket).length;
      const focusMarket = summary.focusMarkets[stateCode];
      const rows = list
        .map(
          (h) => `
            <tr class="${h.inFocusMarket ? "focus-row" : ""}">
              <td>${h.ccn}</td>
              <td>${h.name}</td>
              <td>${h.cbsaName}</td>
              <td>${h.type}</td>
            </tr>
          `
        )
        .join("");
      return `
        <p class="summary-sub" style="margin-top:1rem;">
          <span class="state-group-label">${stateLabel}</span>
          — ${list.length} participant hospital${list.length === 1 ? "" : "s"}
          (${focusCount} in ${focusMarket})
        </p>
        <div class="summary-table-wrap">
          <table class="summary-table">
            <thead>
              <tr>
                <th>CCN</th>
                <th>Hospital</th>
                <th>Market (CBSA)</th>
                <th>Participant Type</th>
              </tr>
            </thead>
            <tbody>
              ${rows || `<tr><td colspan="4">None currently on the list.</td></tr>`}
            </tbody>
          </table>
        </div>
      `;
    };

    container.innerHTML = `
      <div class="summary-panel">
        <h3>
          TEAM participant hospitals — NM &amp; TX
          <span class="focus-legend"><span class="focus-swatch"></span> our focus markets</span>
        </h3>
        <p class="summary-sub">
          As of ${summary.asOf}, from <strong>${summary.sourceDocument}</strong>.
          These are acute-care hospitals participating in TEAM itself —
          separate from the SNF 3-day waiver list below.
        </p>
        ${stateBlock("NM", "New Mexico")}
        ${stateBlock("TX", "Texas")}
      </div>
    `;
  }

  function renderFacilitySummary(cardId) {
    const container = document.getElementById("facility-summary");
    container.innerHTML = "";

    const summary = typeof FACILITY_SUMMARY !== "undefined" ? FACILITY_SUMMARY : null;
    if (!summary || summary.cardId !== cardId) return;

    const rows = summary.facilities
      .map((f) => {
        const found = !!f.name;
        const waiverBadge = !found
          ? `<span class="badge badge-warn">Not on list</span>`
          : f.waiverEligible
          ? `<span class="badge badge-good">Eligible</span>`
          : `<span class="badge badge-bad">Not eligible</span>`;
        const activeBadge = f.activeInTeam
          ? `<span class="badge badge-good">Yes</span>`
          : `<span class="badge badge-bad">No</span>`;
        return `
          <tr>
            <td>${f.ccn}</td>
            <td>${f.name || "&mdash;"}</td>
            <td>${f.city ? `${f.city}, ${f.state}` : "&mdash;"}</td>
            <td>${activeBadge}</td>
            <td>${waiverBadge}</td>
          </tr>
        `;
      })
      .join("");

    const missing = summary.facilities.filter((f) => !f.name).map((f) => f.ccn);

    container.innerHTML = `
      <div class="summary-panel">
        <h3>Current quarter: ${summary.quarter} (effective ${summary.effectivePeriod})</h3>
        <p class="summary-sub">
          MCOA facility status as of ${summary.lastChecked}, checked against
          <strong>${summary.sourceDocument}</strong>. "Active in TEAM" marks
          facilities in a state where TEAM participation is currently
          mandatory; the waiver column reflects the separate SNF 3-day rule
          waiver list, which any qualifying facility can be on regardless of
          TEAM participation.
        </p>
        <div class="summary-table-wrap">
          <table class="summary-table">
            <thead>
              <tr>
                <th>CCN</th>
                <th>Facility</th>
                <th>Location</th>
                <th>Active in TEAM</th>
                <th>3-Day Waiver (${summary.quarter})</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>
        ${
          missing.length
            ? `<p class="summary-note">CCN${missing.length > 1 ? "s" : ""} ${missing.join(
                ", "
              )} ${missing.length > 1 ? "do" : "does"} not appear on the ${summary.quarter} approved list — double-check the CCN, or confirm with CMS whether this is expected.</p>`
            : ""
        }
      </div>
    `;
  }

  function showDetail(cardId) {
    const card = CARDS.find((c) => c.id === cardId);
    if (!card) return;
    document.getElementById("card-grid").style.display = "none";
    document.getElementById("detail-view").style.display = "block";
    document.getElementById("detail-title").textContent = card.title;
    document.getElementById("detail-description").textContent = card.description;

    renderTeamHospitalSummary(cardId);
    renderFacilitySummary(cardId);

    const docs = DOCUMENTS.filter((d) => d.cardId === cardId);

    const list = document.getElementById("doc-list");
    list.innerHTML = "";

    if (docs.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          No documents uploaded yet for this topic.<br /><br />
          Upload files into <code>${card.folder}</code> in this repo, then add
          an entry to <code>documents.js</code> to list them here.
        </div>
      `;
      return;
    }

    // Documents sharing a `group` value render together inside a collapsed-
    // by-default expandable folder, in the order each group first appears
    // in DOCUMENTS; ungrouped documents (no `group` field) render flat with
    // no folder wrapper, same as before grouping existed. Within a group,
    // newest (by dateAdded) still comes first — this is purely a display
    // grouping, it doesn't change where the actual files live.
    const groupOrder = [];
    const groups = {};
    docs.forEach((doc) => {
      const key = doc.group || "";
      if (!groups[key]) {
        groups[key] = [];
        groupOrder.push(key);
      }
      groups[key].push(doc);
    });

    groupOrder.forEach((key) => {
      const groupDocs = groups[key].sort((a, b) =>
        (b.dateAdded || "").localeCompare(a.dateAdded || "")
      );

      if (!key) {
        // Ungrouped documents render flat, exactly as they always have.
        groupDocs.forEach((doc) => list.appendChild(buildDocItem(doc, card)));
        return;
      }

      const groupLi = document.createElement("li");
      groupLi.className = "doc-group";
      groupLi.innerHTML = `
        <button type="button" class="doc-group-header" aria-expanded="false" onclick="toggleGroup(this)">
          <span class="doc-group-icon">📁</span>
          <span class="doc-group-title">${key}</span>
          <span class="doc-group-count">${groupDocs.length}</span>
          <span class="doc-group-chevron">⌄</span>
        </button>
        <div class="doc-group-body"><ul class="doc-group-list"></ul></div>
      `;
      const bodyList = groupLi.querySelector(".doc-group-list");
      groupDocs.forEach((doc) => bodyList.appendChild(buildDocItem(doc, card)));
      list.appendChild(groupLi);
    });
  }

  function buildDocItem(doc, card) {
    const li = document.createElement("li");
    li.className = "doc-item";
    li.innerHTML = `
      <div class="doc-info">
        <h3>${doc.title}</h3>
        <p>${doc.description || ""}</p>
        ${doc.dateAdded ? `<span class="date">Added ${doc.dateAdded}</span>` : ""}
      </div>
      <a class="open-btn" href="${card.folder}${doc.filename}" target="_blank" rel="noopener">Open</a>
    `;
    return li;
  }

  // Expands/collapses one folder group in the document list. Collapsed by
  // default (see showDetail()) so a topic with several groups doesn't dump
  // every document on screen at once.
  function toggleGroup(headerEl) {
    const groupEl = headerEl.closest(".doc-group");
    const expanded = !groupEl.classList.contains("expanded");
    groupEl.classList.toggle("expanded", expanded);
    headerEl.setAttribute("aria-expanded", String(expanded));
  }

  function showGrid() {
    document.getElementById("detail-view").style.display = "none";
    document.getElementById("card-grid").style.display = "grid";
  }

  renderGrid();
</script>

</body>
</html>
